<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dogear</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#14161a">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>📕 Dogear</h1>
  <nav>
    <a href="#" data-view="home" class="active">Home</a>
    <a href="#" data-filter="">Library</a>
    <a href="#" data-view="series">Series</a>
    <a href="#" data-view="stats">Stats</a>
  </nav>
  <form id="searchform">
    <input id="libsearch" placeholder="Search your library…" autocomplete="off">
    <input id="searchbox" placeholder="Find on Shelfmark…" autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <button id="btn-aa-grab" class="ghost">⬇ Paste AA link</button>
</header>

<main>
  <section id="home-view">
    <div id="home-continue-section" hidden>
      <h2>📖 Continue</h2>
      <div class="home-row" id="continue-row"></div>
    </div>
    <div id="home-recent-section">
      <h2>✨ Recently added</h2>
      <div class="home-row" id="recent-row"></div>
    </div>
  </section>

  <section id="series-view" hidden>
    <h2>Series</h2>
    <div class="grid" id="series-grid"></div>
  </section>

  <section id="stats-view" hidden>
    <h2>Reading stats</h2>
    <div id="stats-cards" class="stats-grid"></div>
    <div id="stats-activity"></div>
  </section>

  <section id="aa-grab-view" hidden>
    <h2>Grab from Anna's Archive</h2>
    <p class="muted" style="max-width:560px">Browse annas-archive.gd in your browser, copy the book's URL (or its md5), paste it below with a title.</p>
    <form id="aa-grab-form">
      <input id="aa-link" placeholder="https://annas-archive.gd/md5/… or raw md5" autocomplete="off" required>
      <input id="aa-title" placeholder="Title" required autocomplete="off">
      <input id="aa-author" placeholder="Author (optional)" autocomplete="off">
      <button type="submit" id="aa-submit">Download</button>
    </form>
    <div id="aa-result" class="muted"></div>
  </section>

  <section id="library-view" hidden>
    <div class="view-head">
      <h2 id="lib-title">My shelf</h2>
      <button id="hh-toggle" class="hh-toggle">🏠 Household library</button>
      <form id="filterform" style="display:flex; gap:.4rem;">
        <a href="#" data-filter="" class="chip active" style="color:var(--fg); text-decoration:none; padding:.2rem .6rem;">All</a>
        <a href="#" data-filter="wanted" class="chip" style="color:var(--fg); text-decoration:none; padding:.2rem .6rem;">Wanted</a>
        <a href="#" data-filter="grabbed" class="chip" style="color:var(--fg); text-decoration:none; padding:.2rem .6rem;">Grabbing</a>
        <a href="#" data-filter="reading" class="chip" style="color:var(--fg); text-decoration:none; padding:.2rem .6rem;">Reading</a>
        <a href="#" data-filter="read" class="chip" style="color:var(--fg); text-decoration:none; padding:.2rem .6rem;">Read</a>
      </form>
    </div>
    <div class="grid" id="library-grid"></div>
  </section>
  <section id="results-view" hidden>
    <div class="view-head">
      <button id="results-back" class="ghost">← Back</button>
      <h2>Search results</h2>
    </div>
    <div class="grid" id="results-grid"></div>
  </section>
</main>

<template id="card-tpl">
  <div class="card">
    <div class="cover-wrap"><img class="cover" loading="lazy"></div>
    <div class="meta">
      <div class="title"></div>
      <div class="author"></div>
      <div class="status"></div>
    </div>
    <div class="actions"></div>
  </div>
</template>

<div id="picker-overlay" hidden>
  <div id="picker-dialog">
    <div class="picker-head">
      <h3 id="picker-title"></h3>
      <button id="picker-close" class="ghost">✕</button>
    </div>
    <p id="picker-book-label" class="muted"></p>
    <div class="picker-tools">
      <button id="picker-autopick">✨ Auto-pick best</button>
      <span id="picker-count" class="muted"></span>
    </div>
    <div id="picker-list"></div>
  </div>
</div>

<div id="detail-overlay" hidden>
  <div id="detail-dialog">
    <button id="detail-close" class="ghost" style="align-self:flex-end">✕</button>
    <div class="detail-head">
      <img id="detail-cover" class="detail-cover" alt="">
      <div class="detail-meta">
        <h2 id="detail-title"></h2>
        <div id="detail-author" class="muted"></div>
        <div id="detail-facts" class="detail-facts"></div>
      </div>
    </div>
    <div id="detail-description" class="detail-desc"></div>
    <div class="detail-actions">
      <button id="detail-read">📖 Read</button>
      <button id="detail-enrich" class="ghost">✨ Fetch metadata</button>
    </div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
