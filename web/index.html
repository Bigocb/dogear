<body class="app">

<!-- primary navigation: bottom tab bar on phones, side rail on wide screens -->
<nav id="tabbar" aria-label="Main">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Dogear</div>
  <a href="#" data-view="home" class="active">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V6.5A2.5 2.5 0 0 1 6.5 4H20v13H6.5A2.5 2.5 0 0 0 4 19.5 2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
    <span>Home</span>
  </a>
  <a href="#" data-view="library">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h3v18H5zM10 3h3v18h-3zM15.5 4.2l2.9-.8 4 17.4-2.9.8z"/></svg>
    <span>Library</span>
  </a>
  <a href="#" data-view="find">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <span>Find</span>
  </a>
  <a href="#" data-view="stats">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span>Stats</span>
  </a>
</nav>

<main>

  <!-- ===== Home ===== -->
  <section id="home-view" class="view">
    <header class="page-head">
      <h1 class="page-title">Good reading</h1>
      <button class="avatar" data-account aria-label="Account"></button>
    </header>
    <div id="home-hero"></div>
    <div id="home-shelves"></div>
  </section>

  <!-- ===== Library ===== -->
  <section id="library-view" class="view" hidden>
    <header class="page-head">
      <h1 class="page-title">Library</h1>
      <button class="avatar" data-account aria-label="Account"></button>
    </header>
    <div class="segmented" id="scope-seg" role="tablist">
      <button data-scope="shelf" class="on" role="tab">My shelf</button>
      <button data-scope="household" role="tab">Household</button>
    </div>
    <label class="searchfield">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="libsearch" type="search" placeholder="Search titles and authors" autocomplete="off">
    </label>
    <div class="chips" id="filter-chips">
      <button data-filter="" class="on">All</button>
      <button data-filter="reading">Reading</button>
      <button data-filter="imported">Unread</button>
      <button data-filter="read">Finished</button>
      <button data-filter="wanted">Wanted</button>
      <button data-filter="grabbed">Downloading</button>
      <button data-filter="audio">Audiobooks</button>
      <button data-filter="offline">Offline</button>
    </div>
    <div class="grid" id="library-grid"></div>
    <section id="series-block" hidden>
      <h2 class="shelf-title">Series</h2>
      <div id="series-list"></div>
    </section>
  </section>

  <!-- ===== Find (acquisition) ===== -->
  <section id="find-view" class="view" hidden>
    <header class="page-head">
      <h1 class="page-title">Find a book</h1>
      <button class="avatar" data-account aria-label="Account"></button>
    </header>
    <form id="searchform" class="searchfield big">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="searchbox" type="search" placeholder="Title, author or ISBN" autocomplete="off" enterkeyhint="search">
      <button type="submit" class="btn primary">Search</button>
    </form>
    <p class="hint">Search Hardcover and Open Library. Add a result to your wanted list, then grab it from the book's page.</p>
    <div class="grid" id="results-grid"></div>

    <details id="aa-block" class="panel">
      <summary>Have an Anna's Archive link?</summary>
      <form id="aa-grab-form">
        <label class="field"><span>Link or MD5</span>
          <input id="aa-link" placeholder="https://annas-archive.org/md5/…" autocomplete="off" required></label>
        <label class="field"><span>Title</span>
          <input id="aa-title" autocomplete="off" required></label>
        <label class="field"><span>Author <em>optional</em></span>
          <input id="aa-author" autocomplete="off"></label>
        <button type="submit" id="aa-submit" class="btn primary">Download</button>
      </form>
      <div id="aa-result" class="hint"></div>
    </details>
  </section>

  <!-- ===== Stats ===== -->
  <section id="stats-view" class="view" hidden>
    <header class="page-head">
      <h1 class="page-title">Reading</h1>
      <button class="avatar" data-account aria-label="Account"></button>
    </header>
    <div id="stats-body"></div>
  </section>
</main>

<!-- book sheet (bottom sheet on phones, dialog on desktop) -->
<div class="scrim" id="book-scrim" hidden>
  <div class="sheet" id="book-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-body" id="book-sheet-body"></div>
  </div>
</div>

<!-- release picker -->
<div class="scrim" id="picker-scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="picker-title">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-body">
      <div class="sheet-head">
        <div>
          <h2 id="picker-title" class="sheet-title">Choose a download</h2>
          <p id="picker-book-label" class="hint"></p>
        </div>
        <button class="icon-btn" id="picker-close" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="picker-tools">
        <button id="picker-autopick" class="btn primary">Pick the best one for me</button>
        <span id="picker-count" class="hint"></span>
      </div>
      <div id="picker-list"></div>
    </div>
  </div>
</div>

<!-- account menu -->
<div class="scrim light" id="account-scrim" hidden>
  <div class="menu" id="account-menu" role="menu"></div>
</div>

<!-- reading-list import -->
<div class="scrim" id="import-scrim" hidden>
  <div class="sheet tall" role="dialog" aria-modal="true">
    <div class="grabber"></div>
    <div class="sheet-body" id="import-sheet-body"></div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>

<script src="/static/offline.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
