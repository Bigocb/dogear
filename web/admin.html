<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dogear — Admin</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>⚙︎ Admin</h1>
  <nav><a href="/">← Dogear</a></nav>
</header>

<main id="admin-root">
  <div class="admin-section">
    <h2>Users</h2>
    <div id="users-list"></div>
    <form id="user-add-form" style="display:flex; gap:.5rem; margin-top:.8rem; flex-wrap:wrap;">
      <input class="admin-input" id="nu-username" placeholder="username" required style="width:180px">
      <input class="admin-input" id="nu-password" type="password" placeholder="password" required style="width:180px">
      <select class="admin-input" id="nu-role"><option value="user">user</option><option value="admin">admin</option></select>
      <button type="submit">Add user</button>
    </form>
  </div>

  <div class="admin-section">
    <h2>Metadata</h2>
    <p class="muted" style="font-size:.85rem">Fetch descriptions, covers, series and publication details for books that are missing them (via Hardcover/OpenLibrary through Shelfmark).</p>
    <button id="btn-enrich-all">✨ Enrich all missing metadata</button>
    <div id="enrich-result" class="muted" style="margin-top:.6rem"></div>
  </div>

  <div class="admin-section">
    <h2>System status</h2>
    <div id="sys-status"></div>
  </div>

  <div class="admin-section">
    <h2>Activity (recent imports & grabs)</h2>
    <div id="activity-feed" class="act-feed"></div>
  </div>
</main>
<script type="module" src="/static/admin.js"></script>
</body>
</html>
